{# Fragment for the generation form: choose a model of the provider. #}
<div id="model-list">
  {% if error %}
  <small class="field-error">{{ error }}</small>
  {% else %}
  <label for="model-choice">{{ t('{count} models from {provider}', de='{count} Modelle von {provider}', count=result.models | length, provider=result.provider) }}</label>
  <select id="model-choice" x-on:change="$refs.model.value = $event.target.value">
    <option value="">{{ t('Choose a model …', de='Modell wählen …') }}</option>
    {% for name in result.models %}
    <option value="{{ name }}">{{ name }}</option>
    {% endfor %}
  </select>
  <small>{{ t('The selection is copied to the “Model” field.', de='Die Auswahl landet im Feld „Modell“.') }}</small>
  {% endif %}
</div>
