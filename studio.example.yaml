# Einstellungen von Anki Studio (nicht die Generator-Konfiguration).
# Lokal: cp studio.example.yaml studio.yaml
# Im Container: /etc/anki-studio/studio.yaml
# Secrets gehören nie in diese Datei, sondern in die Umgebungsdatei.

# Adresse, auf der die Oberfläche lauscht. Lokal 127.0.0.1, im Container 0.0.0.0.
host: 127.0.0.1

# Port der Oberfläche.
port: 8000

# Namen und IP-Adressen, unter denen der Browser Anki Studio aufruft (ohne Port).
# Andere Host-Header werden mit 400 abgelehnt (Schutz vor DNS-Rebinding).
allowed_hosts:
  - localhost
  - 127.0.0.1

# Ordner für Jobs und später die Sammlung. Relativ zu dieser Datei; im Container
# /var/lib/anki-studio.
data_dir: data

# Abgeschlossene Jobs werden nach so vielen Tagen gelöscht.
job_retention_days: 14

# YAML-Konfiguration des Generators (Profile, Standardwerte, pdf_conversion).
# Relativ zu dieser Datei; im Container /etc/anki-studio/config.yaml.
generator_config: config.yaml
