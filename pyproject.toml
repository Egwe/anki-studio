[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "anki-studio"
version = "0.1.0"
description = "Web interface for the Anki Flashcard Generator and client of a self-hosted Anki sync server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anki==26.09.4",
    "anki-flashcard-generator @ git+https://github.com/Egwe/anki-flashcard-generator@v0.2.1",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.18,<1",
    "PyYAML>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# Structured PDF mode (AS-041): Docling through the generator and PyTorch from
# the CUDA 12.6 index, the build that still contains sm_50 for the Quadro K1200
# (requirements.md, section 5.3).
pdf = [
    "anki-flashcard-generator[pdf] @ git+https://github.com/Egwe/anki-flashcard-generator@v0.2.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.scripts]
anki-studio = "anki_studio.cli:run"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["sync: local Anki sync-server integration test"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["C90", "D", "E", "F", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
